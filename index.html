<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Разбор партии</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">♞</span> Разбор партии</div>
    <div class="topright">
      <div class="voice" id="voicebox" hidden>
        <button id="vtoggle" class="ghost" title="Озвучка комментариев">🔇 Озвучка</button>
        <select id="vsel" title="Голос"></select>
      </div>
      <button id="newbtn" class="ghost" hidden>Новый разбор</button>
    </div>
  </header>

  <main id="app">
    <section id="input" class="hero">
      <h1>Разбор партии</h1>
      <p class="sub">Вставьте ссылку на партию chess.com или PGN — получите оценку каждого хода, точность и пояснения.</p>
      <div class="card form">
        <div class="field-row">
          <input id="gameid" placeholder="Ссылка или id партии chess.com" autocomplete="off" />
          <input id="user" placeholder="Ваш ник на chess.com" autocomplete="off" />
          <button id="load" class="primary">Разобрать</button>
        </div>
        <details>
          <summary>Или вставить PGN</summary>
          <textarea id="pgn" rows="6" placeholder="[Event &quot;…&quot;]&#10;1. e4 e5 2. Nf3 …"></textarea>
          <div class="field-row">
            <button id="run" class="primary">Разобрать PGN</button>
            <button id="sample" class="ghost">Вставить пример</button>
          </div>
        </details>
        <label class="depth">Глубина анализа
          <select id="depth">
            <option value="10">10 — быстро</option>
            <option value="12">12</option>
            <option value="14" selected>14 — рекомендуется</option>
            <option value="18">18 — глубоко</option>
          </select>
        </label>
        <div id="progress" hidden><div id="bar"></div><span id="ptext"></span></div>
        <p id="error" class="error" hidden></p>
      </div>
    </section>

    <section id="review" hidden>
      <div class="layout">
        <div class="left">
          <div class="player" id="ptop"></div>
          <div class="boardrow">
            <div id="evalbar"><div id="evalfill"></div><span id="evaltext"></span></div>
            <div class="bwrap" id="bwrap">
              <div id="board" class="cg-wrap"></div>
              <div id="badge" class="badge" hidden></div>
            </div>
          </div>
          <div class="player" id="pbot"></div>
          <div class="controls">
            <button data-nav="start" title="В начало">⏮</button>
            <button data-nav="prev" title="Назад (←)">◀</button>
            <button data-nav="next" title="Вперёд (→)">▶</button>
            <button data-nav="end" title="В конец">⏭</button>
            <button data-nav="flip" class="ghost" title="Перевернуть">⇅</button>
          </div>
        </div>

        <aside class="right">
          <div class="card head">
            <h2>Итоги партии</h2>
            <div id="opening" class="opening"></div>
            <div class="acc">
              <div class="accbox"><small id="nw"></small><b id="accw"></b><em id="rw"></em></div>
              <div class="accbox"><small id="nb"></small><b id="accb"></b><em id="rb"></em></div>
            </div>
            <p class="note">Точность — по формуле Lichess; рейтинг партии — приблизительная оценка.</p>
          </div>
          <div class="card coach" id="explain"></div>
          <canvas id="graph" height="90"></canvas>
          <div class="card" id="summary"></div>
          <div class="card moves" id="moves"></div>
        </aside>
      </div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
